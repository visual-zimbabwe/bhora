<script>
    (function initFixtures() {
      const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      const tzLabel = document.getElementById('detected-tz-label');
      if (tzLabel) {
        const shortName = userTimeZone.replace(/_/g, ' ');
        tzLabel.textContent = 'Times shown in ' + shortName;
      }

      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
        timeZoneName: 'short'
      });

      const fixtureItems = document.querySelectorAll('.fixture-item');
      fixtureItems.forEach(item => {
        const utcStr = item.getAttribute('data-utc');
        if (utcStr) {
          const date = new Date(utcStr);
          const formatted = timeFormatter.format(date);
          const timeElem = item.querySelector('.kickoff-display');
          if (timeElem) {
            timeElem.textContent = formatted;
          }
        }
      });

      const searchInput = document.getElementById('search-input');
      const groups = document.querySelectorAll('.fixture-group');
      const noResults = document.getElementById('no-results');

      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          const query = (e.target.value || '').trim().toLowerCase();
          let totalVisible = 0;

          groups.forEach(group => {
            const matches = group.querySelectorAll('.fixture-item');
            let groupVisible = 0;

            matches.forEach(m => {
              const home = (m.getAttribute('data-home') || '').toLowerCase();
              const away = (m.getAttribute('data-away') || '').toLowerCase();

              if (!query || home.includes(query) || away.includes(query)) {
                m.classList.remove('hidden');
                groupVisible++;
                totalVisible++;
              } else {
                m.classList.add('hidden');
              }
            });

            if (groupVisible === 0) {
              group.classList.add('hidden');
            } else {
              group.classList.remove('hidden');
            }
          });

          if (totalVisible === 0) {
            noResults.classList.remove('hidden');
          } else {
            noResults.classList.add('hidden');
          }
        });
      }
    })();
  </script>

ve('hidden'); } else { noResults.classList.add('hidden'); } } } filterAll.addEventListener('click', function() { activeFilter = 'all'; updateFilterUi(); applyFiltering(); }); filterLive.addEventListener('click', function() { activeFilter = 'live'; updateFilterUi(); applyFiltering(); }); var searchInput = document.getElementById('search-input'); if (searchInput) { searchInput.addEventListener('input', function() { applyFiltering(); }); } })();</script></main>
